# Example: run the scanner every Monday against a real account from GitHub Actions.
# Copy to .github/workflows/ in a private repo. Uses OIDC, so no long-lived AWS keys
# are stored in GitHub. Create an IAM role that trusts token.actions.githubusercontent.com
# and attach iam-policy/awsscan-readonly.json to it.

name: Weekly AWS security scan

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/awsscan-readonly
          aws-region: eu-west-3
      - run: pip install -r requirements.txt
      - run: python -m awsscan scan --regions eu-west-3,us-east-1 --out reports --fail-on critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-security-report
          path: reports/
