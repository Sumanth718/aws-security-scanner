[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-security-scanner"
version = "1.0.0"
description = "Audit an AWS account against CIS-aligned security checks and get HTML, JSON and CSV reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sai Sumanth" }]
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.scripts]
awsscan = "awsscan.cli:main"

[tool.setuptools.packages.find]
include = ["awsscan*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
